services:
  - type: web
    name: vox-ai-studio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vox-ai-studio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_API_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: xtts
      - key: AI_INFERENCE_URL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

databases:
  - name: vox-ai-studio-db
    plan: free
